name: Configure Main Branch Protection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-main-protection.yml"
  workflow_dispatch:

permissions: write-all

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          body='{
            "required_status_checks": {
              "strict": true,
              "contexts": ["validate"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }'

          http_code="$(curl --silent --show-error             --output response.json             --write-out '%{http_code}'             --request PUT             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/branches/main/protection"             --data "$body")"

          cat response.json
          echo
          echo "HTTP_STATUS=$http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
