name: Production Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://nexora-guard-core.lovable.app
      SUPABASE_URL: https://c--f46c7dc2-f8c6-4710-96bb-07ffc11e5270-prod.lovable.cloud
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_eWI2U31KL-zYV8Mn_AzGlw_40-gaGMC
    steps:
      - name: Verify production host
        shell: bash
        run: |
          set -euo pipefail
          root_code="$(curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30             --silent --show-error --location --output /tmp/root.html --write-out '%{http_code}'             "$BASE_URL/")"
          echo "root_http_status=$root_code"
          test "$root_code" = "200"

      - name: Verify auth route
        shell: bash
        run: |
          set -euo pipefail
          auth_code="$(curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30             --silent --show-error --location --output /tmp/auth.html --write-out '%{http_code}'             "$BASE_URL/auth")"
          echo "auth_http_status=$auth_code"
          test "$auth_code" = "200"

      - name: Verify agent API fails closed without credential
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30             --silent --show-error --output /tmp/agent.json --write-out '%{http_code}'             --request POST             --header 'Content-Type: application/json'             --data '{"kind":"model","modelKey":"openai/gpt-4.1-mini","prompt":"smoke","idempotencyKey":"00000000-0000-4000-8000-000000000001"}'             "$BASE_URL/api/agent")"
          cat /tmp/agent.json
          echo
          echo "agent_unauthenticated_http_status=$code"
          test "$code" = "401"
          grep -q 'Valid agent bearer credential required' /tmp/agent.json

      - name: Verify invalid user session is rejected
        shell: bash
        run: |
          set -euo pipefail
          invalid_jwt='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDAiLCJleHAiOjQxMDI0NDQ4MDB9.invalid'
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --silent --show-error --output /tmp/invalid-session.json --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $invalid_jwt" \
            "$SUPABASE_URL/rest/v1/organizations?select=id&limit=1")"
          echo "invalid_user_session_http_status=$code"
          test "$code" = "401"
