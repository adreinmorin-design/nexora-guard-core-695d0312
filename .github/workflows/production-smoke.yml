name: Production Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://nexora-guard-core.lovable.app
    steps:
      - name: Verify production host
        shell: bash
        run: |
          set -euo pipefail
          root_code="$(curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30             --silent --show-error --location --output /tmp/root.html --write-out '%{http_code}'             "$BASE_URL/")"
          echo "root_http_status=$root_code"
          test "$root_code" = "200"

      - name: Verify auth route
        shell: bash
        run: |
          set -euo pipefail
          auth_code="$(curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30             --silent --show-error --location --output /tmp/auth.html --write-out '%{http_code}'             "$BASE_URL/auth")"
          echo "auth_http_status=$auth_code"
          test "$auth_code" = "200"

      - name: Verify agent API fails closed without credential
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30             --silent --show-error --output /tmp/agent.json --write-out '%{http_code}'             --request POST             --header 'Content-Type: application/json'             --data '{"kind":"model","modelKey":"openai/gpt-4.1-mini","prompt":"smoke","idempotencyKey":"00000000-0000-4000-8000-000000000001"}'             "$BASE_URL/api/agent")"
          cat /tmp/agent.json
          echo
          echo "agent_unauthenticated_http_status=$code"
          test "$code" = "401"
          grep -q 'Valid agent bearer credential required' /tmp/agent.json
