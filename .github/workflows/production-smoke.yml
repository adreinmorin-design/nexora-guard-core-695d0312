name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Target base URL or host (default: repo var NEXORA_HOST, else https://nexora-guard-core.lovable.app)"
        required: false
        default: ""
      supabase_url:
        description: "Supabase URL (default: repo var SUPABASE_URL, else the legacy Lovable Cloud URL)"
        required: false
        default: ""
      supabase_publishable_key:
        description: "Supabase publishable key (default: repo var SUPABASE_PUBLISHABLE_KEY, else the legacy Lovable Cloud key)"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Precedence: workflow_dispatch input > repo variable > legacy Lovable value.
      BASE_URL: ${{ inputs.host || vars.NEXORA_HOST || 'https://nexora-guard-core.lovable.app' }}
      SUPABASE_URL: ${{ inputs.supabase_url || vars.SUPABASE_URL || 'https://c--f46c7dc2-f8c6-4710-96bb-07ffc11e5270-prod.lovable.cloud' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_eWI2U31KL-zYV8Mn_AzGlw_40-gaGMC' }}
    steps:
      - name: Resolve smoke target
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          case "$base" in
            http://*|https://*) ;;
            *) base="https://$base" ;;
          esac
          echo "BASE_URL=$base" >> "$GITHUB_ENV"
          echo "smoke_base_url=$base"
          echo "smoke_supabase_url=$SUPABASE_URL"

      - name: Verify production host
        shell: bash
        run: |
          set -euo pipefail
          root_code="$(curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30             --silent --show-error --location --output /tmp/root.html --write-out '%{http_code}'             "$BASE_URL/")"
          echo "root_http_status=$root_code"
          test "$root_code" = "200"

      - name: Verify auth route
        shell: bash
        run: |
          set -euo pipefail
          auth_code="$(curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30             --silent --show-error --location --output /tmp/auth.html --write-out '%{http_code}'             "$BASE_URL/auth")"
          echo "auth_http_status=$auth_code"
          test "$auth_code" = "200"

      - name: Verify agent API fails closed without credential
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30             --silent --show-error --output /tmp/agent.json --write-out '%{http_code}'             --request POST             --header 'Content-Type: application/json'             --data '{"kind":"model","modelKey":"openai/gpt-4.1-mini","prompt":"smoke","idempotencyKey":"00000000-0000-4000-8000-000000000001"}'             "$BASE_URL/api/agent")"
          cat /tmp/agent.json
          echo
          echo "agent_unauthenticated_http_status=$code"
          test "$code" = "401"
          grep -q 'Valid agent bearer credential required' /tmp/agent.json

      - name: Verify invalid user session is rejected
        shell: bash
        run: |
          set -euo pipefail
          invalid_jwt='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDAiLCJleHAiOjQxMDI0NDQ4MDB9.invalid'
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --silent --show-error --output /tmp/invalid-session.json --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $invalid_jwt" \
            "$SUPABASE_URL/rest/v1/organizations?select=id&limit=1")"
          echo "invalid_user_session_http_status=$code"
          test "$code" = "401"

      - name: Verify forged agent credential is denied admission
        shell: bash
        run: |
          set -euo pipefail
          forged="nxr_$(printf '0%.0s' $(seq 1 64))"
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --silent --show-error --output /tmp/agent-forged.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $forged" \
            --data '{"kind":"model","modelKey":"openai/gpt-4.1-mini","prompt":"smoke","idempotencyKey":"00000000-0000-4000-8000-000000000002"}' \
            "$BASE_URL/api/agent")"
          cat /tmp/agent-forged.json
          echo
          echo "agent_forged_credential_http_status=$code"
          test "$code" = "403"
          grep -q 'Agent admission denied' /tmp/agent-forged.json

      - name: Verify MCP endpoint fails closed without credential
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --silent --show-error --output /tmp/mcp.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "$BASE_URL/api/mcp")"
          cat /tmp/mcp.json
          echo
          echo "mcp_unauthenticated_http_status=$code"
          test "$code" = "401"
          grep -q 'Agent authentication or admission denied' /tmp/mcp.json
