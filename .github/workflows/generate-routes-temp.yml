name: Generate routes

on:
  push:
    branches:
      - feat/server-entitlements-device-discovery-20260919

permissions:
  contents: write

jobs:
  routes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/server-entitlements-device-discovery-20260919
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Commit generated route tree
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore(routes): regenerate route tree"
          git push origin HEAD:feat/server-entitlements-device-discovery-20260919
