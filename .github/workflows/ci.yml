name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify toolchain
        run: |
          test "$(bun --version)" = "1.4.2"
          grep -q '"packageManager": "bun@1.4.2"' package.json
          node --version
          bun --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run complete Nexora verification
        run: bash scripts/verify-all.sh
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexora-verification-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 30
      - name: Alert Slack on CI failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured; CI failure alert skipped."
            exit 0
          fi
          payload="$(node -e 'const p={text:`[NEXORA CRITICAL] CI failed for ${process.env.REPO}@${process.env.REF} (${process.env.SHA.slice(0,7)}) by ${process.env.ACTOR}. ${process.env.RUN_URL}`}; process.stdout.write(JSON.stringify(p))')"
          curl --fail --silent --show-error --max-time 10 \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack CI alert delivery failed."
