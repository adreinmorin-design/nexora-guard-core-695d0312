name: Prepare live execution UI

on:
  push:
    branches:
      - feat/live-execution-ai-admin-20260919

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/live-execution-ai-admin-20260919
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx prettier --write src/lib/nexora/pipeline.ts src/lib/nexora/agents.server.ts src/lib/nexora/gateway.server.ts src/lib/nexora/mcp.server.ts src/lib/nexora.functions.ts src/lib/nexora/execution-trace.server.ts src/lib/nexora/ai-controls.server.ts src/routes/_authenticated/execution-control.tsx src/routes/_authenticated/admin.ai-control.tsx src/components/nexora/AppShell.tsx tests/gateway.test.mjs tests/database.test.mjs
      - run: bun run build
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: prepare live execution control"
          git push origin HEAD:feat/live-execution-ai-admin-20260919
