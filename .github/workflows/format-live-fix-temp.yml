name: Format live fix

on:
  push:
    branches:
      - feat/live-execution-ai-admin-20260919

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/live-execution-ai-admin-20260919
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx prettier --write src/lib/nexora.functions.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nexora.functions.ts
          git commit -m "style: format live execution server functions"
          git push origin HEAD:feat/live-execution-ai-admin-20260919
