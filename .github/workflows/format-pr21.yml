name: Format governance tranche

on:
  push:
    branches:
      - feat/governed-execution-core-20260925

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/governed-execution-core-20260925
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx prettier --write src/lib/nexora/governance-runtime.server.ts src/lib/nexora/agents.server.ts src/lib/nexora/gateway.server.ts src/lib/nexora/mcp.server.ts src/lib/nexora/agent-input.ts src/lib/nexora/retrospective-policy.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nexora/governance-runtime.server.ts src/lib/nexora/agents.server.ts src/lib/nexora/gateway.server.ts src/lib/nexora/mcp.server.ts src/lib/nexora/agent-input.ts src/lib/nexora/retrospective-policy.ts
          git commit -m "style: format governance tranche"
          git push origin HEAD:feat/governed-execution-core-20260925
