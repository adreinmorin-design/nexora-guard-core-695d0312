name: Legal format diagnostic

on:
  push:
    branches:
      - legal/paddle-policies-20260929

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Print canonical formatting
        run: |
          echo '---TERMS---'
          bunx prettier src/routes/terms.tsx
          echo '---BILLING---'
          bunx prettier docs/billing.md
