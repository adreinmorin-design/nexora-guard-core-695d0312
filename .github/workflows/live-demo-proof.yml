name: Live Nexora Demo Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-demo-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run live proof
        shell: bash
        run: |
          set -euo pipefail
          URL="https://nexora-guard-core.lovable.app/api/demo-proof2?proof=nexora-live-proof-20260920"
          code=""
          for i in {1..12}; do
            code="$(curl -sS -o proof.json -w '%{http_code}' --max-time 60 "$URL" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "Attempt $i returned HTTP $code; retrying..."
            sleep 10
          done
          test "$code" = "200"
          python - <<'PY'
          import json
          with open("proof.json") as f:
              d=json.load(f)
          print(json.dumps(d, indent=2))
          m=d["modelInvocation"]
          t=d["toolInvocation"]
          assert m["httpStatus"] == 200, m
          assert m["persistedRequest"], m
          assert m["persistedRequest"]["provider"] == "openai", m
          assert m["persistedRequest"]["status"] == "completed", m
          assert float(m["persistedRequest"]["cost_usd"]) <= d["controls"]["perRequestCeilingUsd"], m
          assert t["httpStatus"] == 403, t
          stages=[(x["execution_id"],x["stage"],x["status"]) for x in d["executionTrace"]]
          model_id=m["executionId"]
          tool_id=t["executionId"]
          assert any(x[0]==model_id and x[1]=="permissions" and x[2]=="passed" for x in stages), stages
          assert any(x[0]==model_id and x[1]=="budget" and x[2]=="passed" for x in stages), stages
          assert any(x[0]==model_id and x[1]=="provider_selection" and x[2]=="passed" for x in stages), stages
          assert any(x[0]==model_id and x[1]=="execution" and x[2]=="completed" for x in stages), stages
          assert any(x[0]==tool_id and x[1]=="tool_authorization" and x[2]=="blocked" for x in stages), stages
          assert any(a["action"]=="gateway.request" for a in d["auditEvidence"]), d["auditEvidence"]
          assert d["credentialRevoked"] is True
          print("\nLIVE_PROOF_PASS")
          PY
