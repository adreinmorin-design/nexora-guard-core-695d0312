name: Temporary formatting repair

on:
  push:
    branches:
      - ci/repair-20260918

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/repair-20260918
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx prettier --write src/integrations/supabase/public-config.ts tests/auth-runtime.test.mjs
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/public-config.ts tests/auth-runtime.test.mjs
          git commit -m "style: apply canonical Prettier formatting"
          git push origin HEAD:ci/repair-20260918
