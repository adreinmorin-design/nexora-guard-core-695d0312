name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test, Audit, Build, & Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.2

      - name: Install Dependencies (Frozen Lockfile)
        run: bun install --frozen-lockfile

      - name: Run Linter
        run: bun run lint

      - name: Run Tests
        run: bun test

      - name: Run Security Audit
        run: bun audit
        continue-on-error: false

      - name: Run Build / Typecheck
        # Fake, non-secret placeholders for the validation build only; this
        # artifact is not deployed (deploy.yml builds from repo vars).
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_secret
        run: bun run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/
          if-no-files-found: error
          include-hidden-files: true

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
