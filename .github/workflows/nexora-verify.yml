name: Nexora Verification

on:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Verify toolchain
        run: |
          node --version
          bun --version
          test "$(bun --version)" = "1.4.2"
          grep -q '"packageManager": "bun@1.4.2"' package.json

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Run full Nexora verification
        run: bash scripts/verify-all.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-verification-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 30
